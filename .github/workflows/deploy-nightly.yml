name: Nightly PR Deploy

on:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  NODE_VERSION: 22
  AWS_REGION: eu-central-1

jobs:
  deploy:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "pr_number=nightly" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: CDK Bootstrap
        run: npx cdk bootstrap --profile ""
        env:
          CDK_NEW_BOOTSTRAP: 1

      - name: Deploy PR stacks
        run: |
          PR_SUFFIX="PR-${{ steps.pr.outputs.pr_number }}"
          npx cdk deploy --all \
            --require-approval never \
            --profile "" \
            --outputs-file ./cdk-outputs.json \
            --context suffix=-$PR_SUFFIX
        env:
          CDK_NEW_BOOTSTRAP: 1

      - name: Comment API endpoints on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('./cdk-outputs.json')) {
              console.log('No outputs file found');
              return;
            }
            const outputs = JSON.parse(fs.readFileSync('./cdk-outputs.json', 'utf8'));
            let body = '## 🚀 Preview Deployed\n\n**API Endpoints:**\n\n';
            for (const [stack, resources] of Object.entries(outputs)) {
              body += `### ${stack}\n\`\`\`\n`;
              for (const [key, val] of Object.entries(resources)) {
                body += `${key}: ${val}\n`;
              }
              body += '\`\`\`\n\n';
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body?.startsWith('## 🚀 Preview Deployed')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    name: Cleanup Closed PR
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy PR stacks
        run: |
          npx cdk destroy --all --force --profile ""
        env:
          CDK_NEW_BOOTSTRAP: 1
